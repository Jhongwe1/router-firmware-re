# The test register — the single owner of per-test state for W05–W07.
#
# Read tools/rtcase.py first: it explains why the predictions are frozen and why
# a result cannot be recorded for a case whose `refute` is empty.
#
# Fields
#   id             stable identifier, referenced by results and by notes/
#   phase          groups the ledger; titles are in [ledger].phase_titles
#   section        the section of the working manual the procedure lives in
#   feasibility    1–5, rated against THIS unit, not in general
#   exit_evidence  the grade this claim carried before any packet was sent:
#                  dynamic | static | other-build | presumed | unverified |
#                  refuted | none
#   week           when it is scheduled to run. Hashed into [schedule], so it
#                  can move but not quietly
#   rescheduled_from / reschedule_reason / reschedule_date
#                  required together when `week` moves; `rtcase check` refuses a
#                  move without all three
#   star           mark items that are this project's own, or that gate others
#   caution        shown as a warning in the ledger: irreversible, or affects
#                  something outside the lab
#   predict        what the code/data says should happen        ] frozen —
#   refute         what would mean the claim is NOT true        ] see [freeze]
#   cut_reason     set instead of running it; the item is listed with its reason
#
# `refute` is the field this file exists for. Everything else is bookkeeping.

schema_version = "1"

[freeze]
# sha256 over (id, predict, refute) of every case that has a refutation.
# Change a prediction and this must change in the same commit, where the diff
# shows it. `python3 tools/rtcase.py freeze` prints the current value.
sha256 = "69c342dce863dcc7d2450d3f45f97ad2b3753296a2c8756a54ec27604caffc55"
committed = "2026-08-17"
note = "W05 Day 0 — frozen before any request has been served to this device."

[schedule]
# sha256 over (id, week) of every live case. `week` is deliberately NOT in
# [freeze]: rescheduling is legitimate and re-freezing for it would make the
# freeze mean two things. But it was not checked at all until 2026-08-17, and
# that gap had teeth — four cases sat in W05 that W05's own plan forbids
# running, so `make todo WEEK=W05` could never reach zero without either
# breaking the plan or editing the field. Editing it quietly is
# indistinguishable from moving the goalposts, so now it hashes.
# `python3 tools/rtcase.py schedule` prints the current value.
sha256 = "fd9a23c53b8b39aea7a1da5cb6091c343fba922820c2a9512921ce0c99323fcc"
committed = "2026-08-17"
note = """The payload changed on 2026-08-17: it was (id, week) and is now
(id, week, rescheduled_from, reschedule_date, reschedule_reason), so every
declared hash before this line is on the old basis and cannot be compared to
this one. It changed because of a specific failure, not for symmetry — see
`tools/rtcase.py schedule_payload`.

Four cases moved out of W05 on 2026-08-17; each carries its reason.
Ten more moved out of W06 the same day — the Phase 4/5 fuzz and
exploit-development block. Same failure as the W05 four: the register was built
by walking the playbook's sections, so cases landed in the week whose section
number matched rather than the week whose plan admits them, and W06's plan
forbids fuzzing outright. The reasons here are not "no time": P4-9 is blocked on
the device (nothing respawns boa, so a run is ~45 requests per power cycle) AND
in emulation (P0-9 refuted — boa cannot complete one GET under qemu-user), and
the P5-1 chain has no oracle at all, because this unit has no shell and no
gdbserver and nothing here has ever shown that a userspace fault prints
registers on its console."""

[ledger]
output = "test-ledger.md"
title = "測試登記簿 — W05–W07 的逐項預測、反證條件與結果"

preamble = '''
> **這份檔案由 `tools/rtcase.py render` 生成。要改內容改 `test-cases.toml`，改這裡會被覆蓋。**

## 這份檔案是什麼，以及它跟 PROGRESS.md 的分工

**一份狀態只能有一個擁有者。**

| 檔案 | 擁有什麼 | 不擁有什麼 |
|---|---|---|
| `PROGRESS.md` | gate 與週的敘事、carried-forward 開放題 | 單項測試的狀態 |
| **本檔** | **單項測試的預測、反證條件、結果、證據** | gate 的判定 |
| `README.md` | gate 勾選板 + 一行數字 | 這張表本身 |

gate 可以引用本檔的某一列，**不可以複述它**。2026-08-16 的那次
「document sync 跑在當週最後兩個 commit 之前」就是同一份狀態被兩個檔案擁有的結果。

## 為什麼預測要先凍結

**反證欄不能空白。** 一個沒有事先寫下「失敗長什麼樣」的測試，事後一定會被解讀成成功——
因為回應到手的時候，讀的人已經知道自己想看到什麼了。

所以：

1. 預測與反證寫在送出任何封包**之前**，雜湊進 `[freeze].sha256`；
2. 事後要改，就得在同一個 commit 裡改掉那個雜湊，`git diff` 會把它顯示成兩行刻意的修改；
3. `rtcase check` 在 CI 裡擋下「有結果但沒反證條件」的列——這條規則是機械執行的，不是自律。

這不是防篡改（鑰匙在作者手上），是**把「悄悄改掉」變成「看得見地改掉」**。

## 這一份吸收掉的東西

W05 週計畫原本要另外建一份 `notes/prediction-scorecard.md`（12 條預測，格式幾乎相同）。
**那會是同一份狀態的第二個擁有者**，所以併進本檔，不另建：12 條裡 10 條已有對應項
（`P1-1` / `P6-11` / `P6-6` / `P1-10` / `P10-1` / `P1-3` / `P3-1` / `P4-1` / `P2-8` / `P2-7`），
另外 2 條補為 **`P1-12`**（開機到 web 可服務 < 40 秒）與 **`P0-10`**（每次動手前抓 64 KiB
設定區快照）。

**併的時候第 4 條（UPnP）翻案了，而且翻掉的是本檔原本的預測** —— 經過寫在
`PROGRESS.md` W05 Day 0。

## 靜態 ≠ 動態

`結果` 欄的 ✅ **只給真機動態證據**。靜態逆向讀出來的結論即使成立也只記 🟥，
因為到目前為止**這台一個請求都還沒服務過**。把 🟥/🟧/🟨/🟦 推到 ✅、或釘死成 ❌，
就是 W05–W07 的全部工作。**釘死也是產出。**
'''

postamble = '''
---

## 怎麼記錄一次執行

```bash
python3 tools/rtcase.py record --id P3-3 --date 2026-08-20 \
    --verdict confirmed --evidence dynamic \
    --artefact poc/formSysCmd/README.md --note "回應 200，/web/k 出現 uid=0"
python3 tools/rtcase.py render      # 重生成本檔
python3 tools/rtcase.py check       # CI 也會跑
```

`record` 會拒絕記錄一個沒有反證條件的項目。這是刻意的。

## 逐項的原始紀錄卡

每一次執行都要留 request / response 原文。紀錄卡格式與「這一步燒掉了什麼」欄位在
`RUNBOOK.md` §8.10.5；本檔只留判定與證據連結，不留原文。

**「反證檢查」那一行必須對得起本檔凍結的那一句。** 對不起來，就是實際測的東西
已經不是當初登記的那一項了。
'''

