star = true
predict = '''`/bin/startup.sh` 由 `rcS` 直接呼叫，開頭是這個結構：`flash test-dsconf` 失敗**而且** `flash test-csconf` 也失敗時，走 `flash default-sw`，然後**明文寫著 `flash set TELNET_ENABLED 1`**。也就是說兩個設定區同時無效，這台會用出廠預設開機**並且自己把 telnet 打開**，而 `/etc/passwd.org` 裡的 `root` / `123456` 與 `onlime_r` / `12345`（uid 0）從 2015 到現在沒動過（W02 的三版對照）。

**但這條不能只從腳本讀出來，因為它取決於 `flash` 的語義而不是腳本的字面：** `$LOADDEFSW` 之後還有一段 `test-csconf` 失敗就跑 `$LOADDS`（`flash reset1`，把 default 蓋回 current）。若 `default-sw` 只修好 COMPDS 而沒修好 COMPCS，那個 `reset1` 會把剛剛 `set` 的 `TELNET_ENABLED 1` 蓋掉，整條就不成立。預測是**成立**，理由是 `default-sw` 的名字與位置都指向它同時建立兩區，但這一半是推論不是量測。

若成立，它翻掉 `P8-12` 的前提：那一條說鏈卡在「fwrecon 沒有 COMPCS encoder，做不出有效的設定檔」，而這裡要的是**無效**的設定區，那不需要 encoder。'''
refute = '''兩區都填成無效之後開機，`TELNET_ENABLED` 仍然是 0 → 對腳本的讀法錯了，或 `reset1` 把它蓋掉了。**兩種都要分辨清楚**：跑完之後既要讀 `flash get TELNET_ENABLED`，也要 dump 兩個設定區看誰被寫過，否則「沒開」會被寫成「這條不存在」而實際上是「開了又被關掉」——後者是同一個缺陷的另一種形狀。另一個反證方向：`test-dsconf` / `test-csconf` 的失敗條件比 checksum 嚴格得多（例如只認某個 signature），使得攻擊者能造成的損壞不會被判為無效 → 那這條在模擬下成立而在真實攻擊面上不成立，要照這樣寫。'''

