# The test register — the single owner of per-test state for W05–W07.
#
# Read tools/rtcase.py first: it explains why the predictions are frozen and why
# a result cannot be recorded for a case whose `refute` is empty.
#
# Fields
#   id             stable identifier, referenced by results and by notes/
#   phase          groups the ledger; titles are in [ledger].phase_titles
#   section        the section of the working manual the procedure lives in
#   feasibility    1–5, rated against THIS unit, not in general
#   exit_evidence  the grade this claim carried before any packet was sent:
#                  dynamic | static | other-build | presumed | unverified |
#                  refuted | none
#   week           when it is scheduled to run. Hashed into [schedule], so it
#                  can move but not quietly
#   rescheduled_from / reschedule_reason / reschedule_date
#                  required together when `week` moves; `rtcase check` refuses a
#                  move without all three
#   star           mark items that are this project's own, or that gate others
#   caution        shown as a warning in the ledger: irreversible, or affects
#                  something outside the lab
#   predict        what the code/data says should happen        ] frozen —
#   refute         what would mean the claim is NOT true        ] see [freeze]
#   cut_reason     set instead of running it; the item is listed with its reason
#
# `refute` is the field this file exists for. Everything else is bookkeeping.

schema_version = "1"

[freeze]
# sha256 over (id, predict, refute) of every case that has a refutation.
# Change a prediction and this must change in the same commit, where the diff
# shows it. `python3 tools/rtcase.py freeze` prints the current value.
sha256 = "ea8cf7335c6ae448ce3c35b0c03e212970bd5ef612f0b53e329e2d2a2cc7f7e6"
committed = "2026-08-18"
note = """W05 Day 0 — frozen before any request has been served to this device.

2026-08-18: two cases added, P0-11 and P3-14, both for G4 clause 3a — the L2
reproduction on an image anyone can download. They are frozen here *before* the
environment they describe has been built, and the commit that adds them carries
no result. That ordering is the whole claim: the prediction that a
container-only flash cannot start boa is on the record before the measurement
that settles it, and both of them can fail in either direction.

2026-08-18, later the same day — eleven cases gained a `predict` and a `refute`
they never had, and one case is new. Every one of them was scheduled for W07 and
none could have carried a result: P6-12, P8-2, P8-4, P8-6, P8-7, P8-11, P8-14,
P8-16, P8-19, P9-4, plus the new P9-13. `make todo WEEK=W07` had been printing
"(no refutation condition yet)" against them since the register was built, which
is the tool doing its job — but it is a warning, not a blocker, and eleven of
W07's rows were therefore unrecordable while the week's plan scheduled them all
for one bench visit. Writing them the night before the visit rather than after it
is the entire point of this file, so they are written now, from evidence that
already exists: the W05 full-range TCP sweep, P1-10's live UPnP, P10-3's
unauthenticated password change, P2-7's per-request Basic auth, the rootfs
binary inventory, and the boot log. Three of them (P6-12, P8-4, P8-6) are
narrower than their titles suggest, because prior measurements had already
answered part of what they asked — and saying so is cheaper than re-measuring.

P9-13 is new and it exists because P9-10 moved to W08. The half of P9-10 that is
not irreversible — read the upgrade path, find out which header fields are
actually checked — is W07 work and it is also plan Day 6's deliverable, which
had no register row at all. One row now means one thing.

P8-24 is new and was written from a line of `/bin/startup.sh` found while
answering P8-8. It is frozen here before the experiment that settles it, and the
experiment is a desktop one — corrupt both settings regions in the emulation
profile's flash image and see what the boot script does. The prediction commits
to "telnet ends up enabled" while naming the specific way it could be wrong
(`flash reset1` running afterwards and overwriting the set), because that half
is inference from the script's wording and not a measurement of what `flash
default-sw` writes.

2026-08-18, second desk session — one prediction was EDITED and one case is new,
and both happened before anything was sent.

**P4-9's `refute` was replaced, and the reason is that it could not fire.** It
named "P4-3's known crash" as the positive control proving the fuzz harness's
survival detection works. P4-3 was recorded `refuted` on this build on
2026-08-17: `formNtp` echoes `submit-url` into `Location`, 800 bytes come back
as 799, no truncation at 100 and no crash at any length. So the control did not
exist — and a refutation whose second clause is permanently true degrades into
"zero crashes means the harness is broken", which reads a correct negative
result as an instrument failure. The replacement names a control that does exist
and has been measured: with `--alignfix` and a pristine flash before every
probe, `formSchedule` is the one handler of 58 that removes `boa`. Editing a
frozen field is allowed and is never allowed to be quiet; that is what this hash
is for, and the reasoning is in `PROGRESS.md` § Corrections.

**P2-11 is new: the 601-second window.** `process_header_end` has a third arm
nobody had read — an IP-keyed session written by `form_formLogin`, expiring on
`nowuptime - beforeuptime >= 601`, where `beforeuptime` is never written. It is
frozen here **before the bench visit that is the only thing able to answer it**,
and the emulator is excluded inside the refutation rather than left as an
option, because `qemu-user`'s `sysinfo()` returns the host's uptime and every
desktop has been up longer than 601 seconds. Its refutation runs in two
directions and the second one accuses this project's own instruments: if the arm
is still live after 601 seconds then Ghidra's reference model and
`tools/mipsref.py`'s encoding scan missed the same write, and the instrument is
what gets fixed first."""

[schedule]
# sha256 over (id, week) of every live case. `week` is deliberately NOT in
# [freeze]: rescheduling is legitimate and re-freezing for it would make the
# freeze mean two things. But it was not checked at all until 2026-08-17, and
# that gap had teeth — four cases sat in W05 that W05's own plan forbids
# running, so `make todo WEEK=W05` could never reach zero without either
# breaking the plan or editing the field. Editing it quietly is
# indistinguishable from moving the goalposts, so now it hashes.
# `python3 tools/rtcase.py schedule` prints the current value.
sha256 = "f7d9c9bcbb151f5090facc536ae1aa105105caca178d0daa25b7170e4bf2f2fd"
committed = "2026-08-18"
note = """The payload changed on 2026-08-17: it was (id, week) and is now
(id, week, rescheduled_from, reschedule_date, reschedule_reason), so every
declared hash before this line is on the old basis and cannot be compared to
this one. It changed because of a specific failure, not for symmetry — see
`tools/rtcase.py schedule_payload`.

Four cases moved out of W05 on 2026-08-17; each carries its reason.
Ten more moved out of W06 the same day — the Phase 4/5 fuzz and
exploit-development block. Same failure as the W05 four: the register was built
by walking the playbook's sections, so cases landed in the week whose section
number matched rather than the week whose plan admits them, and W06's plan
forbids fuzzing outright. The reasons here are not "no time": P4-9 is blocked on
the device, because nothing respawns boa and a run costs ~45 requests per power
cycle; and the P5-1 chain has no oracle *on the device*, because this unit has
no shell and no gdbserver and nothing here has ever shown that a userspace fault
prints registers on its console.

Two clauses stood here until 2026-08-18 and both were wrong — the same two the
reschedule reasons were corrected for on 2026-08-17. This paragraph said P4-9
was blocked in emulation as well, citing "P0-9 refuted — boa cannot complete one
GET under qemu-user", and that the P5-1 chain had no oracle at all. P0-9 came
back `confirmed` that same evening: boa serves under qemu-user once the start-up
`config.dat` write is made to fail, and qemu prints the signal and si_addr
itself, so the oracle does exist on the desktop even though it does not on the
device. Every *hashed* field was corrected that night. This note was not,
because the schedule hash covers (id, week, rescheduled_from, reschedule_date,
reschedule_reason) and not the prose that summarises them — so the register's
own header went on asserting, for a day, the claim its own rows had already
withdrawn, in the same file. Instrument bug 28, and the same shape as 23: a
refuted claim surviving in a place no checker reads.

2026-08-18, W07: one case moved, P9-10 → W08, and its reason is the only kind
this project accepts for an irreversible step — ordering, not caution. The unit
is the single point of failure for G2 and G4 and it is also the target of the
twenty-odd W07 tests that have not run yet, so writing a modified image to its
flash before those tests would be spending the week to buy one row. The half of
P9-10 that is not irreversible became P9-13 and stays in W07.
2026-08-18, second desk session: no week moved. The hash changed because
**P2-11 is a new case**, and the schedule payload covers every live case rather
than only the moved ones — so adding a row moves it. That is intended, and it is
written down because a hash that changes for a benign reason with no note is
indistinguishable from one that changed for a bad one.
"""

[ledger]
output = "test-ledger.md"
title = "測試登記簿 — W05–W07 的逐項預測、反證條件與結果"

preamble = '''
> **這份檔案由 `tools/rtcase.py render` 生成。要改內容改 `test-cases.toml`，改這裡會被覆蓋。**

## 這份檔案是什麼，以及它跟 PROGRESS.md 的分工

**一份狀態只能有一個擁有者。**

| 檔案 | 擁有什麼 | 不擁有什麼 |
|---|---|---|
| `PROGRESS.md` | gate 與週的敘事、carried-forward 開放題 | 單項測試的狀態 |
| **本檔** | **單項測試的預測、反證條件、結果、證據** | gate 的判定 |
| `README.md` | gate 勾選板 + 一行數字 | 這張表本身 |

gate 可以引用本檔的某一列，**不可以複述它**。2026-08-16 的那次
「document sync 跑在當週最後兩個 commit 之前」就是同一份狀態被兩個檔案擁有的結果。

## 為什麼預測要先凍結

**反證欄不能空白。** 一個沒有事先寫下「失敗長什麼樣」的測試，事後一定會被解讀成成功——
因為回應到手的時候，讀的人已經知道自己想看到什麼了。

所以：

1. 預測與反證寫在送出任何封包**之前**，雜湊進 `[freeze].sha256`；
2. 事後要改，就得在同一個 commit 裡改掉那個雜湊，`git diff` 會把它顯示成兩行刻意的修改；
3. `rtcase check` 在 CI 裡擋下「有結果但沒反證條件」的列——這條規則是機械執行的，不是自律。

這不是防篡改（鑰匙在作者手上），是**把「悄悄改掉」變成「看得見地改掉」**。

## 這一份吸收掉的東西

W05 週計畫原本要另外建一份 `notes/prediction-scorecard.md`（12 條預測，格式幾乎相同）。
**那會是同一份狀態的第二個擁有者**，所以併進本檔，不另建：12 條裡 10 條已有對應項
（`P1-1` / `P6-11` / `P6-6` / `P1-10` / `P10-1` / `P1-3` / `P3-1` / `P4-1` / `P2-8` / `P2-7`），
另外 2 條補為 **`P1-12`**（開機到 web 可服務 < 40 秒）與 **`P0-10`**（每次動手前抓 64 KiB
設定區快照）。

**併的時候第 4 條（UPnP）翻案了，而且翻掉的是本檔原本的預測** —— 經過寫在
`PROGRESS.md` W05 Day 0。

## 靜態 ≠ 動態

`結果` 欄的 ✅ **只給真機動態證據**。靜態逆向讀出來的結論即使成立也只記 🟥，
因為到目前為止**這台一個請求都還沒服務過**。把 🟥/🟧/🟨/🟦 推到 ✅、或釘死成 ❌，
就是 W05–W07 的全部工作。**釘死也是產出。**
'''

postamble = '''
---

## 怎麼記錄一次執行

```bash
python3 tools/rtcase.py record --id P3-3 --date 2026-08-20 \
    --verdict confirmed --evidence dynamic \
    --artefact poc/formSysCmd/README.md --note "回應 200，/web/k 出現 uid=0"
python3 tools/rtcase.py render      # 重生成本檔
python3 tools/rtcase.py check       # CI 也會跑
```

`record` 會拒絕記錄一個沒有反證條件的項目。這是刻意的。

## 逐項的原始紀錄卡

每一次執行都要留 request / response 原文。紀錄卡格式與「這一步燒掉了什麼」欄位在
`RUNBOOK.md` §8.10.5；本檔只留判定與證據連結，不留原文。

**「反證檢查」那一行必須對得起本檔凍結的那一句。** 對不起來，就是實際測的東西
已經不是當初登記的那一項了。
'''

