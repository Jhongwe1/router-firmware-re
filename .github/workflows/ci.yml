name: CI

# What CI can and cannot check here
# ---------------------------------
# It cannot run the analysis: vendor firmware is not redistributed, so no image
# is available to a runner. What it *can* check is that the tooling which
# produces the analysis is correct and installable — the test suite builds every
# structure it needs (a section-header-stripped MIPS ELF, a Realtek container, a
# SquashFS superblock) from scratch, precisely so that this holds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    name: fwrecon (lint + tests)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject; 3.12 is what the WSL
        # workstation actually runs. Both must stay green.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install fwrecon
        working-directory: tools/fwrecon
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        working-directory: tools/fwrecon
        run: ruff check src tests

      # The standalone scripts under tools/ were outside every lint target
      # until 2026-08-16: they are not inside the fwrecon package, so ruff's
      # upward config search never reaches tools/fwrecon/pyproject.toml and
      # they were checked under default rules, which is close to not at all.
      # --config points them at the same file rather than adding a second one
      # that can drift. Must stay identical to `make lint`, or local green
      # stops meaning CI green -- see RUNBOOK 10.21.
      - name: Lint standalone tools
        run: ruff check --config tools/fwrecon/pyproject.toml tools/*.py

      - name: Test
        working-directory: tools/fwrecon
        run: pytest -q

  shellcheck:
    name: shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning tools/*.sh tools/setup/*.sh

  register:
    name: test register (frozen predictions + evidence)
    runs-on: ubuntu-24.04
    # Needs no firmware and no device: the register is text, and every check is
    # a property of the text. That is why this one can run on every push while
    # `make recon` cannot.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate — the register is frozen and every result carries evidence
        run: python3 tools/rtcase.py check
      # And the gate must be able to fail. Without this step the one above going
      # green would carry no information — instrument bug 12, which shipped a
      # self-check that only fired when it had something to work on.
      - name: Control — the gate rejects what it claims to reject
        run: bash tools/test-rtcase.sh
      # The ledger is generated. If a commit edits it by hand, or edits the
      # register without re-rendering, the two disagree and this catches it —
      # the same "one owner per state" rule the register exists to enforce.
      - name: The ledger matches the register it is generated from
        run: |
          python3 tools/rtcase.py render
          git diff --exit-code -- study/test-ledger.md \
            || { echo "study/test-ledger.md is out of date — run \`make ledger\`"; exit 1; }

  toolbox-image:
    name: toolchain image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile ends in a smoke test that runs every pinned tool, so a
      # successful build is itself the assertion that the pins still resolve to
      # something that works.
      - name: Build fwre-toolbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: fwre-toolbox:ci

  reports-current:
    name: committed reports match the tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reports cannot be regenerated without the firmware, but they can be
      # checked for self-consistency: every committed report must parse, be
      # recognisable as the output of one of the two producers (fwrecon and the
      # Ghidra script), and carry the schema version the current source emits.
      - name: Validate reports
        run: python tools/check-reports.py
