name: CI

# What CI can and cannot check here
# ---------------------------------
# It cannot run the analysis: vendor firmware is not redistributed, so no image
# is available to a runner. What it *can* check is that the tooling which
# produces the analysis is correct and installable — the test suite builds every
# structure it needs (a section-header-stripped MIPS ELF, a Realtek container, a
# SquashFS superblock) from scratch, precisely so that this holds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    name: fwrecon (lint + tests)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject; 3.12 is what the WSL
        # workstation actually runs. Both must stay green.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install fwrecon
        working-directory: tools/fwrecon
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        working-directory: tools/fwrecon
        run: ruff check src tests

      # The standalone scripts under tools/ were outside every lint target
      # until 2026-08-16: they are not inside the fwrecon package, so ruff's
      # upward config search never reaches tools/fwrecon/pyproject.toml and
      # they were checked under default rules, which is close to not at all.
      # --config points them at the same file rather than adding a second one
      # that can drift. Must stay identical to `make lint`, or local green
      # stops meaning CI green -- see RUNBOOK 10.21.
      - name: Lint standalone tools
        run: ruff check --config tools/fwrecon/pyproject.toml tools/*.py

      - name: Test
        working-directory: tools/fwrecon
        run: pytest -q

  shellcheck:
    name: shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning tools/*.sh tools/setup/*.sh

  register:
    name: test register (frozen predictions + evidence)
    runs-on: ubuntu-24.04
    # Needs no firmware and no device: the register is text, and every check is
    # a property of the text. That is why this one can run on every push while
    # `make recon` cannot.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate — the register is frozen and every result carries evidence
        run: python3 tools/rtcase.py check
      # And the gate must be able to fail. Without this step the one above going
      # green would carry no information — instrument bug 12, which shipped a
      # self-check that only fired when it had something to work on.
      - name: Control — the gate rejects what it claims to reject
        run: bash tools/test-rtcase.sh
      # The ledger is generated. If a commit edits it by hand, or edits the
      # register without re-rendering, the two disagree and this catches it —
      # the same "one owner per state" rule the register exists to enforce.
      - name: The ledger matches the register it is generated from
        run: |
          python3 tools/rtcase.py render
          git diff --exit-code -- test-ledger.md \
            || { echo "test-ledger.md is out of date — run \`make ledger\`"; exit 1; }

  bench-guards:
    name: bench tooling refuses what it claims to refuse
    runs-on: ubuntu-24.04
    # Both suites are split so that the half needing neither root, nor a flash
    # dump, nor a router runs here. The other half reports itself as *skipped*
    # rather than quietly not running — a suite that silently covers less than
    # it looks like is the shape of instrument bug 12.
    #
    # This job exists because `make ci` runs these and CI did not, which is
    # exactly the divergence RUNBOOK 10.21 was written about: local green has to
    # mean CI green, or running the local check stops being a check.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: qemu environment — the positive control and the input refusals
        run: bash tools/test-qemu-env.sh
      - name: bench prober — the refusals, against a real local HTTP server
        run: bash tools/test-bench-probe.sh
      - name: boot-loader unpacker — five broken images and one good one
        run: bash tools/test-loader-unpack.sh
      # runsheet.md is hand-written, which is the right call for the one document
      # a stranger follows front to back — and it means a command in it can rot
      # without anyone noticing. This reads every command as a command: make
      # targets, tool paths, subcommands, flags against each tool's own --help,
      # and every §8.x.y reference. It is here and not only in `make ci` because
      # a check that only runs locally eventually only runs sometimes.
      - name: runsheet — every command in it still resolves
        run: python3 tools/check-runsheet.py
      - name: runsheet checker — prove it can fail
        run: bash tools/test-check-runsheet.sh

      # The record-card template lived only in plan/, which is gitignored and
      # which committed files may not quote, so the format BENCH-LOG.md is
      # supposed to follow lived where BENCH-LOG.md could not cite it. It
      # drifted out within one week: nine prose sections, six with no refutation
      # field, written by the session that spent the evening insisting on that
      # exact rule.
      - name: bench log — every record card carries a refutation condition
        run: python3 tools/check-benchlog.py
      - name: bench-log checker — prove it can fail, and that it sees every card
        run: bash tools/test-check-benchlog.sh

      # The four below were outside every CI list until 2026-08-17. Three of
      # them predate this job and were simply never added — 35 cases, none
      # needing hardware, recorded as PROGRESS open #33 when the guard-case
      # totals were recounted and did not add up. The flash reader's suite is
      # the largest of the three, and it guards the code path every byte of this
      # unit's dump came through.
      - name: flash reader — the parser refusals and the redaction rule
        run: bash tools/test-console-dump.sh
      - name: CH341A path — the ways a clip lies
        run: bash tools/test-flash-tools.sh

      # The photo suite needs Pillow, and it REFUSES to run without it rather
      # than reporting green — which is the fix for instrument bug 1, where the
      # reject-only half of this same suite reported 5/5 passing while every
      # invocation was dying on `import PIL`. So the runner installs it: making
      # the suite skip instead would reintroduce exactly the defect it was
      # rewritten to catch.
      #
      # Adding these three suites without checking the runner could run them is
      # the divergence RUNBOOK 10.21 is about, committed in the file that
      # carries the warning. It cost one red build, and it also hid a step: a
      # job stops at its first failure, so `flash writer` never ran at all and
      # the tool with the largest blast radius in this repository had still not
      # been exercised by CI. The two checkers earlier in the list did run.
      - name: photo tools — redaction and annotation guards
        run: |
          python -m pip install --quiet Pillow
          FWRE_PY="$(command -v python)" bash tools/test-photo-tools.sh
      # And the new one. This is the only tool in the repository that can
      # destroy the unit, so its refusals are the ones that most need a machine
      # checking them on every push rather than a habit checking them sometimes.
      - name: flash writer — every range it must refuse, and two it must accept
        run: bash tools/test-console-write.sh

      # And two more that were in `make ci` and not here — the same divergence
      # this job's own header describes, found again on 2026-08-18 and this time
      # in both directions at once: the ledger check was here and not in
      # `make ci`, and these two were in `make ci` and not here. Two lists both
      # calling themselves "everything CI checks", neither containing the other.
      - name: fail-open probe — the refusals that need no environment
        run: bash tools/test-failopen-probe.sh

      # alignfix.so is a MIPS big-endian object, so this suite is the only one
      # here that needs a cross-compiler. Installing it rather than skipping is
      # deliberate and it is the same call the photo suite makes above: the
      # shim's build checks are what prove a *little*-endian object would be
      # rejected, and a suite that skips cannot prove that of anything.
      - name: alignment shim — its refusals, and that the flag is still off by default
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mips-linux-gnu binutils-mips-linux-gnu
          bash tools/test-alignfix.sh

  toolbox-image:
    name: toolchain image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile ends in a smoke test that runs every pinned tool, so a
      # successful build is itself the assertion that the pins still resolve to
      # something that works.
      - name: Build fwre-toolbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: fwre-toolbox:ci

  reports-current:
    name: committed reports match the tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reports cannot be regenerated without the firmware, but they can be
      # checked for self-consistency: every committed report must parse, be
      # recognisable as the output of one of the two producers (fwrecon and the
      # Ghidra script), and carry the schema version the current source emits.
      - name: Validate reports
        run: python tools/check-reports.py
